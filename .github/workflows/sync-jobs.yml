name: VECRON Opportunity Sync

on:
  schedule:
    - cron: "0 0 * * *"   # every 24 hours, 00:00 UTC (5:30 AM IST)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab too

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          VECRON_INGESTION_KEY: ${{ secrets.VECRON_INGESTION_KEY }}
        run: python scripts/sync_jobs.py